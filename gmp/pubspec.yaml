# App icon (Android & iOS)
# After adding/updating icon file run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  # Adaptive icon: foreground is full artwork; background fills masked safe zone
  adaptive_icon_background: "#061F40"
  adaptive_icon_foreground: assets/app.png