# Do not set java.io.tmpdir here with ${user.home}: it is not expanded in all Gradle/Flutter paths and becomes a literal folder name "${user.home}".
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
systemProp.java.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Addresses=true
android.useAndroidX=true
# Avoid Kotlin incremental-cache crashes when the project (D:) and Pub cache (C:) differ.
kotlin.incremental=false
kotlin.incremental.android=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

